name: CI

on:
  push:
    branches: [main]
  pull_request:

# Een nieuwe push op dezelfde branch maakt de vorige run overbodig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit- en databasetests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Bewust vóór `npm ci`: postinstall draait `nuxt prepare`, en
      # @nuxtjs/supabase wil op dát moment al een URL en een sleutel zien.
      # Zonder draaiende stack faalt dus de installatie, niet de tests — een
      # foutmelding die nergens naar wijst.
      - name: Supabase-stack starten
        run: supabase start

      - name: Supabase-gegevens in de omgeving zetten
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          {
            echo "SUPABASE_URL=$(value API_URL)"
            echo "SUPABASE_KEY=$(value ANON_KEY)"
            echo "NUXT_SUPABASE_SECRET_KEY=$(value SERVICE_ROLE_KEY)"
            echo "DATABASE_URL=$(value DB_URL)"
          } >> "$GITHUB_ENV"

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Typecontrole
        run: npm run typecheck

      - name: Unittests
        run: npm run test

      # De databasetests truncaten elke tabel; de guard in test/db/helpers.ts
      # laat dat alleen toe tegen een lokale host. De stack hierboven draait op
      # 127.0.0.1, dus dat klopt hier.
      - name: Databasetests
        run: npm run test:db

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Supabase-stack starten
        run: supabase start

      - name: Supabase-gegevens in de omgeving zetten
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          {
            echo "SUPABASE_URL=$(value API_URL)"
            echo "SUPABASE_KEY=$(value ANON_KEY)"
            echo "NUXT_SUPABASE_SECRET_KEY=$(value SERVICE_ROLE_KEY)"
            echo "DATABASE_URL=$(value DB_URL)"
          } >> "$GITHUB_ENV"

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Browser installeren
        run: npx playwright install --with-deps chromium

      - name: End-to-endtests
        run: npm run test:e2e

      - name: Rapport bewaren bij een mislukking
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Migraties en deploy naar productie
    needs: [check, e2e]
    # Alleen na een merge naar main, nooit op een pull request. Een PR van een
    # fork zou anders met productiegeheimen kunnen draaien.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Eerst het schema, dan de code. Faalt een migratie, dan stopt de job
      # hier en blijft productie draaien op code die bij het huidige schema
      # past — andersom zou je code deployen die op een kolom rekent die er
      # nog niet is.
      #
      # Rechtstreeks naar Postgres, bewust buiten de management-API om. Dat
      # scheelt een accountbreed toegangstoken: `supabase link` haalt ook
      # projectsleutels en instellingen op die wij niet nodig hebben, en elke
      # ontbrekende permissie daarvan kost een mislukte deploy. Deze weg heeft
      # er precies één nodig: de verbindingsstring zelf.
      #
      # Het moet de *session pooler* zijn (poort 5432), om twee redenen. De
      # directe host db.<ref>.supabase.co is op nieuwe projecten alleen over
      # IPv6 bereikbaar en GitHub-runners hebben uitsluitend IPv4 — daar viel
      # de eerste deploy op om. En de transaction pooler (6543) is ongeschikt
      # voor migraties, die sessiestatus nodig hebben.
      #
      # `db push` vergelijkt de bestandsnamen in supabase/migrations tegen de
      # remote historietabel en past alleen toe wat ontbreekt. GitHub zet
      # CI=true, dus de CLI vraagt niet om bevestiging.
      - name: Migraties naar productie
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DB_URL"

      # @nuxtjs/supabase wil al bij `nuxt prepare` (de postinstall) een URL en
      # een sleutel zien, vandaar ook hier.
      - name: Afhankelijkheden installeren
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm ci

      # Hier worden de productiewaarden ingebakken, dus wat de Worker serveert
      # klopt zonder runtime-overschrijving. Dat is bewust: één bron van
      # waarheid. Worker-secrets zouden hetzelfde nog eens vastleggen en stil
      # uit de pas kunnen gaan lopen — zie README, sectie Deploying.
      - name: Bouwen en deployen
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          NUXT_PUBLIC_APP_VERSION: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      # Een geslaagd deploy-commando is niet hetzelfde als een draaiende nieuwe
      # versie. Dit vraagt het de app zelf, en faalt de job als het antwoord
      # niet de zojuist gebouwde commit is.
      - name: Controleren dat de nieuwe versie antwoordt
        env:
          VERWACHT: ${{ github.sha }}
          BASIS: ${{ vars.PRODUCTION_URL }}
        run: |
          for poging in $(seq 1 12); do
            gemeten=$(curl -fsS "$BASIS/api/health"               | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || echo "")
            if [ "$gemeten" = "$VERWACHT" ]; then
              echo "Live op $gemeten"
              exit 0
            fi
            echo "Poging $poging: nog \"$gemeten\", wacht op \"$VERWACHT\""
            sleep 5
          done
          echo "::error::De nieuwe versie antwoordde niet binnen een minuut. De deploy is mogelijk wel geslaagd; controleer $BASIS/api/health."
          exit 1
